<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Week 2 Site</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <p class="site-title">Week 2 Site</p>
            <nav aria-label="Primary">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <main id="main">
            <h1>Client-Side Web Development</h1>
            <section aria-labelledby="signup-title">
                <h2 id="signup-title">Sign-Up</h2>

                <form id="signup-form" novalidate> 
                    <fieldset>
                        <legend> Create your account </legend>
                        <p> 
                        Please fill in the form below to create an account. All fields are required
                        </p>
                        <div id="field">
                            <label for="name">Name:</label>
                            <input id="name" name="name" type="text" minlength="2" required autocomplete="name">
                            <p class="field-error" id="name-error" role="status"></p>
                        </div>

                        <div id="field">
                            <label for="email">Email:</label>
                            <input id="email" name="email" type="email" required="email">
                            <p class="field-error" id="email-error" role="status"></p>
                        </div>
    
                        <div id="field">
                            <label for="password">Password:</label>
                            <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
                            <p class="field-error" id="password-error" role="status"></p>
                        </div>

                        <div id="field">
                            <label for="verify-password">Verify Password:</label>
                            <input id="verify-password" name="verify-password" type="password" required autocomplete="current-password">
                            <p class="field-error" id="verify-password-error" role="status"></p>
                        </div> 

                        <button type="submit">Sign Up</button>
                        <p id="form-message" role="status"></p>
                    </fieldset>
                </form>
                
            </section>
        </main>

        <footer>
            <small>Built in CS 424</small>
        </footer>

        <script src="app.js"></script>
    </body>
</html>
